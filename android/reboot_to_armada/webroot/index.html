<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reboot to Armada</title>
<style>
:root{--bg:#f4f4f5;--fg:#18181b;--card:#fff;--accent:#2563eb;--muted:#71717a}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#f4f4f5;--card:#27272a;--accent:#60a5fa;--muted:#a1a1aa}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.c{background:var(--card);padding:28px 24px;border-radius:16px;max-width:360px;width:calc(100% - 32px);text-align:center;box-shadow:0 2px 12px #0002}
h1{font-size:20px;margin:0 0 8px}p{color:var(--muted);font-size:14px;margin:0 0 20px}
button{width:100%;padding:14px;font-size:17px;border:0;border-radius:10px;background:var(--accent);color:#fff}
button:disabled{opacity:.5}#s{margin-top:14px;font-size:13px;color:var(--muted);white-space:pre-wrap}
</style></head><body><div class="c">
<h1>Reboot to Armada<br>重启到 Armada</h1><p>Switch to slot B and reboot now.<br>切换到 B 槽并立即重启。</p>
<button id="b">Switch &amp; reboot / 切换并重启</button><div id="s"></div></div>
<script>
const s=document.getElementById('s'),b=document.getElementById('b');
b.onclick=()=>{
  if(!confirm('Reboot to Armada? / 确定要重启到 Armada 吗？'))return;
  b.disabled=true;s.textContent='Switching... / 正在切换…';
  const cb='cb'+Date.now();
  window[cb]=(errno,out,err)=>{s.textContent=(out||'')+(err||'');if(errno!==0){b.disabled=false;}delete window[cb];};
  try{ksu.exec('sh /data/adb/modules/reboot_to_armada/switch.sh','{}',cb);}
  catch(e){s.textContent='KernelSU API unavailable / 无法调用 KernelSU: '+e;b.disabled=false;}
};
</script></body></html>
